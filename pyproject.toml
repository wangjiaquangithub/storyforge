[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "storyforge"
version = "0.1.0"
description = "StoryForge new core"
readme = "PRODUCT.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "anthropic>=0.39,<1.0",
  "click>=8.1",
  "httpx>=0.27,<0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9"
]

[project.scripts]
storyforge = "storyforge.cli.main:cli"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
